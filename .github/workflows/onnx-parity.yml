name: EfficientNet ONNX numerical regression

on:
  push:
    branches: [main]
    paths:
      - "python/efficientnet.py"
      - "python/efficientnet_precision.py"
      - "python/efficientnet_precision_tuning.py"
      - "python/onnx_diagnostics.py"
      - "python/export_onnx.py"
      - "python/onnx_session.py"
      - "gui/core/efficientnet_onnx.py"
      - "tests/test_export*.py"
      - "tests/test_onnx*.py"
      - "tests/test_precision*.py"
      - ".github/workflows/onnx-parity.yml"
  pull_request:
    paths:
      - "python/efficientnet.py"
      - "python/efficientnet_precision.py"
      - "python/efficientnet_precision_tuning.py"
      - "python/onnx_diagnostics.py"
      - "python/export_onnx.py"
      - "python/onnx_session.py"
      - "gui/core/efficientnet_onnx.py"
      - "tests/test_export*.py"
      - "tests/test_onnx*.py"
      - "tests/test_precision*.py"
      - ".github/workflows/onnx-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU numerical test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy onnx onnxruntime==1.29.0 opencv-python-headless pillow cryptography
      - name: Test trained BN statistics, original reference and deployment reload
        run: python -m pytest tests/test_export_native_bn.py tests/test_export_precision.py tests/test_precision_tuning.py tests/test_precision_kernels.py tests/test_export_fallback.py tests/test_export_contracts.py tests/test_onnx_diagnostics.py tests/test_onnx_runtime_settings.py -q --junitxml=onnx-parity.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onnx-parity-${{ matrix.os }}
          path: onnx-parity.xml
          retention-days: 3
