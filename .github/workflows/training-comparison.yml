name: Classification training comparison
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r gui/requirements.txt -r webapp/requirements.txt scikit-learn==1.7.2
      - name: Prepare the two official pretrained assets used by this comparison
        run: |
          python - <<'PY'
          import hashlib, json, sys
          sys.path.insert(0, 'python')
          from builtin_assets import ASSET_FILES, builtin_asset_root, builtin_asset_path
          from efficientnet import VARIANTS
          from model_download import cached_imagenet_weights
          root = builtin_asset_root()
          files = {}
          for model_id in ('efficientnet_b0', 'efficientnet_b1'):
              relative = ASSET_FILES[model_id]
              path = cached_imagenet_weights(VARIANTS[model_id].url, (root / relative).parent)
              files[relative] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'bytes': path.stat().st_size}
          (root / 'manifest.json').write_text(json.dumps({'schema_version': 1, 'files': files}), encoding='utf-8')
          for model_id in ('efficientnet_b0', 'efficientnet_b1'):
              print(builtin_asset_path(model_id))
          PY
      - name: Prepare real handwritten images bundled with sklearn
        id: data
        timeout-minutes: 3
        run: python tools/training_comparison.py --prepare-only --dataset digits
      - name: Train source EfficientNet B0
        if: always() && steps.data.outcome == 'success'
        timeout-minutes: 7
        run: python tools/training_comparison.py --role custom_b0
      - name: Train torchvision EfficientNet B0 control
        if: always() && steps.data.outcome == 'success'
        timeout-minutes: 7
        run: python tools/training_comparison.py --role official_b0
      - name: Train source EfficientNet B1
        if: always() && steps.data.outcome == 'success'
        timeout-minutes: 7
        run: python tools/training_comparison.py --role custom_b1
      - name: Train torchvision EfficientNet B1 control
        if: always() && steps.data.outcome == 'success'
        timeout-minutes: 7
        run: python tools/training_comparison.py --role official_b1
      - name: Compare actual predictions and persisted metrics
        if: always() && steps.data.outcome == 'success'
        run: python tools/training_comparison.py --summarize-only
      - name: Publish comparison in the job summary
        if: always()
        shell: bash
        run: |
          if test -f training-comparison/summary.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat training-comparison/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: classification-training-comparison
          retention-days: 3
          path: |
            training-comparison/summary.json
            training-comparison/dataset.json
            training-comparison/*/report.json
            training-comparison/*/events.jsonl
