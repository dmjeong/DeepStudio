name: Recheck installed Windows application
on:
  workflow_call:
    inputs:
      build_run_id:
        description: Completed Windows SDK/payload run whose installer will be tested
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  installed-app:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only the test driver dependency, not the application libraries
        run: python -m pip install psutil
      - name: Install the built MSI and execute with only Windows system directories on PATH
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.build_run_id }}
        run: python tools/recheck_windows_installer.py --repository "$env:GITHUB_REPOSITORY" --run-id "$env:SOURCE_RUN" --output desktop-smoke/isolated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-installed-app-execution
          path: desktop-smoke/
          retention-days: 3
          if-no-files-found: ignore
